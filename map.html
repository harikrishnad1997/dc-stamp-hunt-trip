<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DC Stamp Hunt — Trip Map (color-coded by day)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  #bar { background: #2e5a3c; color: #fff; padding: 10px 14px; }
  #bar h1 { font-size: 18px; margin: 0 0 2px; }
  #bar p { margin: 0; font-size: 13px; opacity: .9; }
  #map { height: calc(100% - 62px); }
  .pin { border-radius: 50%; color: #fff; font-weight: 700; font-size: 12px; text-align: center; line-height: 24px; width: 24px; height: 24px; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45); }
  .pin.park { border-radius: 6px; background: #0f766e; }
  .legend { background: rgba(255,255,255,.92); padding: 6px 8px; border-radius: 6px; box-shadow: 0 1px 5px rgba(0,0,0,.3); font-size: 12px; line-height: 1.55; }
  @media (max-width: 700px) { .legend { display: none; } }
  .legend .chip { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .leaflet-popup-content { font-size: 14px; }
</style>
</head>
<body>
<div id="bar">
  <h1>DC Stamp Hunt — Trip Map</h1>
  <p>Every stop, color-coded by day. Use the layer filter (top right) to show one day at a time. Tap a pin for the stop name and a Google Maps link.</p>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var COLORS = { day1: "#1d6fb8", day2: "#e07b00", day3: "#1e8e3e", hotel: "#7c3aed", airport: "#374151" };
var DAYLABEL = { day1: "Day 1 · Fri Nov 20", day2: "Day 2 · Sat Nov 21", day3: "Day 3 · Sun Nov 22", hotel: "Hotel", airport: "Airport / rental car" };
var STOPS = [
  // Hotel + airport
  { n: "Washington Plaza Hotel", d: "hotel", t: "Thu–Sun base", lat: 38.90584, lng: -77.03139, q: "Washington+Plaza+Hotel+10+Thomas+Circle+NW+Washington+DC" },
  { n: "Reagan National Airport (DCA) — Enterprise, Garage A", d: "airport", t: "Pickup Sat 8:30 PM · Return Sun 6:00 PM", lat: 38.84900, lng: -77.04402, q: "Enterprise+Rent-A-Car+Reagan+National+Airport" },
  // Day 1
  { n: "1 · Lincoln Memorial", d: "day1", t: "8:30 AM", lat: 38.88925, lng: -77.05017, q: "Lincoln+Memorial+Washington+DC" },
  { n: "2 · Korean War Veterans Memorial", d: "day1", t: "9:45 AM", lat: 38.88714, lng: -77.04774, q: "Korean+War+Veterans+Memorial+Washington+DC" },
  { n: "3 · Vietnam Veterans Memorial", d: "day1", t: "10:15 AM", lat: 38.89130, lng: -77.04770, q: "Vietnam+Veterans+Memorial+Washington+DC" },
  { n: "4 · DC War Memorial", d: "day1", t: "11:15 AM", lat: 38.88762, lng: -77.04350, q: "DC+War+Memorial+Washington+DC" },
  { n: "5 · Washington Monument Lodge", d: "day1", t: "12:00 PM", lat: 38.88945, lng: -77.03525, q: "Washington+Monument+Lodge+Washington+DC" },
  { n: "6 · Eisenhower Memorial", d: "day1", t: "1:30 PM", lat: 38.88731, lng: -77.01954, q: "Dwight+D+Eisenhower+Memorial+Washington+DC" },
  { n: "7 · MLK Jr. Memorial", d: "day1", t: "2:30 PM", lat: 38.88630, lng: -77.04433, q: "Martin+Luther+King+Jr+Memorial+Washington+DC" },
  { n: "8 · FDR Memorial", d: "day1", t: "3:45 PM", lat: 38.88448, lng: -77.04521, q: "Franklin+Delano+Roosevelt+Memorial+Washington+DC" },
  { n: "9 · Jefferson Memorial", d: "day1", t: "5:15 PM", lat: 38.88140, lng: -77.03656, q: "Thomas+Jefferson+Memorial+Washington+DC" },
  // Day 2
  { n: "1 · White House Visitor Center", d: "day2", t: "9:00 AM", lat: 38.89514, lng: -77.03280, q: "White+House+Visitor+Center+Washington+DC" },
  { n: "2 · Ford's Theatre", d: "day2", t: "10:00 AM entry (booked)", lat: 38.89659, lng: -77.02580, q: "Fords+Theatre+Washington+DC" },
  { n: "3 · Clara Barton Missing Soldiers Office (optional)", d: "day2", t: "11:15 AM", lat: 38.89582, lng: -77.02174, q: "Clara+Barton+Missing+Soldiers+Office+Museum+Washington+DC" },
  { n: "4 · Bethune Council House — CLOSED for renovation, exterior only (stamp at Douglass VC)", d: "day2", t: "12:00 PM exterior stop", lat: 38.90818, lng: -77.03087, q: "Mary+McLeod+Bethune+Council+House+Washington+DC" },
  { n: "5 · Carter G. Woodson Home", d: "day2", t: "1:15 PM tour (booked)", lat: 38.91082, lng: -77.02418, q: "Carter+G+Woodson+Home+National+Historic+Site+Washington+DC" },
  { n: "6 · African American Civil War Memorial", d: "day2", t: "2:10 PM", lat: 38.91644, lng: -77.02537, q: "African+American+Civil+War+Memorial+Washington+DC" },
  { n: "7 · Frederick Douglass NHS", d: "day2", t: "3:30 PM tour (booked)", lat: 38.86299, lng: -76.98503, q: "Frederick+Douglass+National+Historic+Site+Washington+DC" },
  // Day 3
  { n: "1 · Theodore Roosevelt Island (parking)", d: "day3", t: "9:00 AM", lat: 38.89562, lng: -77.06655, q: "Theodore+Roosevelt+Island+Parking+Arlington+VA" },
  { n: "2 · Lyndon Baines Johnson Memorial Grove (no stamp on site — GW Pkwy HQ / Arlington House)", d: "day3", t: "9:50 AM", lat: 38.87830, lng: -77.05423, q: "Lyndon+Baines+Johnson+Memorial+Grove+Washington+DC" },
  { n: "3 · C&O Canal Georgetown Visitor Center", d: "day3", t: "10:40 AM", lat: 38.90432, lng: -77.05997, q: "Chesapeake+and+Ohio+Canal+Georgetown+Visitor+Center+Washington+DC" },
  { n: "4 · Rock Creek Park Nature Center", d: "day3", t: "11:50 AM", lat: 38.95960, lng: -77.05184, q: "Rock+Creek+Park+Nature+Center+Washington+DC" },
  { n: "5 · Kenilworth Park & Aquatic Gardens", d: "day3", t: "1:00 PM", lat: 38.91263, lng: -76.94181, q: "Kenilworth+Park+and+Aquatic+Gardens+Washington+DC" },
  { n: "6 · Belmont-Paul Women's Equality NM", d: "day3", t: "2:15 PM", lat: 38.89219, lng: -77.00376, q: "Belmont-Paul+Womens+Equality+National+Monument+Washington+DC" },
  { n: "7 · Fort Washington Park, MD (VC closes 4:30 PM)", d: "day3", t: "3:30 PM", lat: 38.71540, lng: -77.02699, q: "Fort+Washington+Park+13551+Fort+Washington+Rd+MD" },
  { n: "8 · Anacostia Park HQ (optional — only if ahead of schedule)", d: "day3", t: "time permitting", lat: 38.87801, lng: -76.96991, q: "Anacostia+Park+1900+Anacostia+Dr+SE+Washington+DC" }
];
var map = L.map("map");
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" }).addTo(map);
var PARKING = [
  { n: "P · Roosevelt Island parking lot", lat: 38.89680, lng: -77.06620, t: "FREE — NPS lot at the footbridge. Northbound GW Parkway lanes only. Small — fills on weekend mornings.", q: "Theodore+Roosevelt+Island+Parking+Arlington+VA" },
  { n: "P · Georgetown street parking (for C&O Canal VC)", lat: 38.90490, lng: -77.06060, t: "FREE on Sundays — DC meters are not enforced on Sundays. Metered spots near Thomas Jefferson St / Wisconsin Ave; Georgetown residential side streets as backup (permit-zone limits are weekday-only). Read the sign on the block.", q: "Thomas+Jefferson+Street+NW+Washington+DC" },
  { n: "P · Rock Creek Nature Center parking lot", lat: 38.95990, lng: -77.05250, t: "FREE — NPS lot at the Nature Center, 5200 Glover Rd NW. (The park's only metered parking is at Thompson Boat Center, far from here.)", q: "Rock+Creek+Park+Nature+Center+Washington+DC" },
  { n: "P · Kenilworth Aquatic Gardens parking lot", lat: 38.91220, lng: -76.94240, t: "FREE — park lot at 1550 Anacostia Ave NE. Kenilworth Park lots nearby are free too.", q: "Kenilworth+Park+and+Aquatic+Gardens+Washington+DC" },
  { n: "P · Belmont-Paul street parking", lat: 38.89260, lng: -77.00460, t: "FREE on Sundays — metered street parking on Constitution Ave NE / 2nd St NE (DC meters not enforced on Sundays); residential side streets as backup. No lot at the house; skip the paid Union Station garage.", q: "Constitution+Avenue+NE+Washington+DC" },
  { n: "P · LBJ Grove parking — Columbia Island Marina lot", lat: 38.87500, lng: -77.04860, t: "FREE — Columbia Island Marina lot on Lady Bird Johnson Park (Columbia Island). Entrance only from the SOUTHBOUND GW Parkway lanes; short paved walk through the parkway tunnel to the grove.", q: "Columbia+Island+Marina+Washington+DC" },
  { n: "P · Fort Washington Park parking", lat: 38.71300, lng: -77.02980, t: "FREE — lots by the visitor center, 13551 Fort Washington Rd, MD. (NPS lists a $10/vehicle entrance fee, reportedly not collected since 2019 — carry a card.)", q: "Fort+Washington+Park+Maryland" },
  { n: "P · Anacostia Park parking lots", lat: 38.87850, lng: -76.97060, t: "FREE — park lots along Anacostia Drive SE, near the NACE headquarters.", q: "Anacostia+Park+Washington+DC" }
];
var GROUPS = { day1: L.layerGroup(), day2: L.layerGroup(), day3: L.layerGroup(), hotel: L.layerGroup(), airport: L.layerGroup(), parking: L.layerGroup() };
var bounds = [];
STOPS.forEach(function (s) {
  var label = s.n.split(" · ")[0];
  var icon = L.divIcon({ className: "", html: '<div class="pin" style="background:' + COLORS[s.d] + '">' + label + "</div>", iconSize: [24, 24], iconAnchor: [12, 12] });
  var popup = "<b>" + s.n + "</b><br>" + DAYLABEL[s.d] + " · " + s.t + '<br><a href="https://www.google.com/maps/search/?api=1&query=' + s.q + '" target="_blank" rel="noopener">Open in Google Maps</a>';
  L.marker([s.lat, s.lng], { icon: icon }).bindPopup(popup).addTo(GROUPS[s.d]);
  bounds.push([s.lat, s.lng]);
});
PARKING.forEach(function (p) {
  var icon = L.divIcon({ className: "", html: '<div class="pin park">P</div>', iconSize: [24, 24], iconAnchor: [12, 12] });
  var popup = "<b>" + p.n + "</b><br>Day 3 · Sun Nov 22<br>" + p.t + '<br><a href="https://www.google.com/maps/search/?api=1&query=' + p.q + '" target="_blank" rel="noopener">Open in Google Maps</a>';
  L.marker([p.lat, p.lng], { icon: icon }).bindPopup(popup).addTo(GROUPS.parking);
});
Object.keys(GROUPS).forEach(function (k) { GROUPS[k].addTo(map); });
L.control.layers(null, {
  "🔵 Day 1 · Fri Nov 20 — National Mall": GROUPS.day1,
  "🟠 Day 2 · Sat Nov 21 — Downtown / Shaw / Anacostia": GROUPS.day2,
  "🟢 Day 3 · Sun Nov 22 — by car": GROUPS.day3,
  "🅿️ Day 3 parking — all free": GROUPS.parking,
  "🟣 Hotel": GROUPS.hotel,
  "⚫ DCA / Enterprise": GROUPS.airport
}, { collapsed: window.innerWidth < 700 }).addTo(map);
map.fitBounds(bounds, { padding: [25, 25] });
var legend = L.control({ position: "bottomright" });
legend.onAdd = function () {
  var div = L.DomUtil.create("div", "legend");
  div.innerHTML = '<span class="chip" style="background:' + COLORS.day1 + '"></span>Day 1 · Fri (Mall, on foot)<br>' +
    '<span class="chip" style="background:' + COLORS.day2 + '"></span>Day 2 · Sat (Downtown/Shaw/Anacostia)<br>' +
    '<span class="chip" style="background:' + COLORS.day3 + '"></span>Day 3 · Sun (by car)<br>' +
    '<span class="chip" style="background:#0f766e"></span>P · Day 3 parking (free)<br>' +
    '<span class="chip" style="background:' + COLORS.hotel + '"></span>Hotel<br>' +
    '<span class="chip" style="background:' + COLORS.airport + '"></span>DCA / Enterprise';
  return div;
};
legend.addTo(map);
</script>
</body>
</html>
